<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wheel of Fortune</title>
</head>
<body>
<script>
//player names array, will be populated at the beginning of the game
var names = [];
//array of words that we can use for the game board. one will be chosen at the start of the game
var words = ["dog", "cat", "fish", "turtle", "hamster", "bunny"];
//current word for this game
var word;
//the board to display the letters and underscores so the players can see it
var board;
//boolean to determine if the player has spun the wheel
var spun = false;
//current guessed letter
var myGuess;
//letters that have already been guessed
var choices = [];
//possible spin values on the wheel
var WheelNums = [0, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000];
//value of the current spin
var currNum;
//amount of money each player has in the game
var Money = [0, 0, 0];
//number of letters that have been guessed correctly
var totGuessed= 0;
//variable to store whose turn it is to play, as an index in the player array 0, 1, 2
var playerTurn;
//function to start the game
function Start()
{
	//assume you are trying to get an A, so you have 3 players in the game
	for(var i = 1; i <= 3; i++)
	{
		//add 3 names to the names array from user input
		names.push(prompt("What is the name of player #" + i + "?"));
	}
	//InitGame();
}
//function to choose the word for the game and determine which player goes first
function InitGame()
{
	//choose a random word from the array of words
	var n = Math.floor(Math.random() * words.length);
	word = words[n];
	MakeWord();
	//decide which player goes first
	playerTurn = Math.floor(Math.random()*3);
	//show on the html whose turn it is
	document.getElementById("Spin").innerHTML = names[playerTurn] + ", it is your turn. Click to spin the wheel!";
	document.getElementById("mon").innerHTML = names[0] + ": " + Money[0] + ", " + names[1] + ": " + Money[1] + ", " + names[2] + ": " + Money[2];
}
//function that makes the game board
function MakeWord()
{
	//we want to make a loop that finds letters in the guessed letter array and updates the board
	//if the letter guessed isn't in the word, tell the user with an alert
	var board = "";
	//use a boolean to determine if the guessed letter is in the guessed letters array and the word
	var found = false;
	//iterate through the word
	for (var i = 0; i < word.length; i++)
	{
		found = false;
		for(var j = 0; j < choices.length; j++)
		{
			//if the letter in the word is in the choices array, add it to board
			if(choices[j] == word[i])
			{
				board = board + choices[j];
				found = true;
			}
		}
		//if the letter from the word was not found in the choices array, then it hasn't been guessed yet
		//add an underscore to the board for that letter
		if(found == false)
		{
			board = board + " _______ ";
		}
	}
	document.getElementById("showWord").innerHTML = "Game Board: " + board;
}
//function that adds money to the player's account when he/she guesses correctly
function AddMoney()
{
	document.getElementById("mon").innerHTML = names[0] + ": " + Money[0] + ", " + names[1] + ": " + Money[1] + ", " + names[2] + ": " + Money[2];
}
//function to switch players after someone guesses wrong
function SwitchPlayers()
{
	
}
//function to spin the wheel and determine the current money value of a guess
function SpinWheel()
{
	//choose a random value from the value of spins
	var randomValue = WheelNums[Math.floor(Math.random() * WheelNums.length)];
	Guess();
}
//function to let a player guess a letter
function Guess()
{
	choices.push(prompt("Enter letter to guess"));
	MakeWord();
	playerTurn = Math.floor(Math.random()*3);
	//show on the html whose turn it is
	document.getElementById("Spin").innerHTML = names[playerTurn] + ", it is your turn. Click to spin the wheel!";
}
</script>
<h1>Welcome to Wheel of Fortune!</h1>
<button type ="button" onclick="Start()">Enter Players Name!</button>
<p id="showWord">Game Board</p>
<br>
<button id="Spin" type="button" onclick="InitGame()">Start the Game!</button>
<p id="dAmount">This is where the dollar amount of the spin will show up.</p>
<button type="button" onclick="SpinWheel()">Spin the Wheel</button>
<p id="mon">Player 1 Money = 0, Player 2 Money = 0, Player 3 Money = 0</p>
<h3 id="win"></h3>
</body>
</html>
